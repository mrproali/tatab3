<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع العادات اليومية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============ الوضع الفاتح (الافتراضي) ============ */
        :root {
            --bg-body: #dce3e8;
            --bg-panel: #ebe8e0;
            --bg-item: #f0ede5;
            --bg-input: #f5f3ed;
            --bg-header: #e4e6e0;
            --bg-date-controls: #e0dfd7;
            --text-main: #2a4a5a;
            --text-sub: #4a7a8e;
            --text-muted: #5a9ab0;
            --border-color: #c8d5dc;
            --border-light: #d5dfe4;
            --border-cell: #dee4e2;
            --shadow: rgba(0,0,0,0.08);
            --progress-bg: #d0dadf;
            
            /* اللون الأساسي الافتراضي (سماوي) */
            --accent-main: #7fc4d9;
            --accent-hover: #5da8c0;
            --accent-text: #2c7a9e;
        }

        /* ============ الوضع الداكن (أسود خالص) ============ */
        body.dark-mode {
            --bg-body: #000000;
            --bg-panel: #0a0a0a;
            --bg-item: #141414;
            --bg-input: #1a1a1a;
            --bg-header: #141414;
            --bg-date-controls: #141414;
            --text-main: #e8e8e8;
            --text-sub: #a0a0a0;
            --text-muted: #808080;
            --border-color: #222222;
            --border-light: #2a2a2a;
            --border-cell: #1a1a1a;
            --shadow: rgba(0,0,0,0.6);
            --progress-bg: #1a1a1a;
        }

        body {
            background: var(--bg-body);
            padding: 12px;
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            gap: 12px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .left-panel, .right-panel {
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 8px;
            }
            .dashboard {
                gap: 8px;
            }
            .stats-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .date-controls {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .counters {
                justify-content: space-around;
                width: 100%;
            }
            .progress-global {
                width: 100%;
            }
            .tracker-table-wrapper {
                padding: 3px 0 6px 0;
            }
            .habit-row {
                grid-template-columns: 130px repeat(31, 32px);
            }
            .days-header {
                grid-template-columns: 130px repeat(31, 32px);
            }
            .habit-title {
                font-size: 11px;
                padding: 6px 4px;
            }
            .day-cell {
                height: 34px;
            }
            .day-checkbox {
                width: 16px;
                height: 16px;
            }
            .weeks-table td {
                font-size: 9px;
                padding: 3px 1px;
            }
        }

        @media (max-width: 480px) {
            .habit-row {
                grid-template-columns: 110px repeat(31, 28px);
            }
            .days-header {
                grid-template-columns: 110px repeat(31, 28px);
            }
            .habit-title {
                font-size: 10px;
                padding: 5px 3px;
            }
            .day-cell {
                height: 30px;
            }
            .day-checkbox {
                width: 14px;
                height: 14px;
            }
            .day-number {
                font-size: 9px;
                padding: 4px 0;
            }
            .section-title {
                font-size: 14px;
            }
        }

        .left-panel {
            background: var(--bg-panel);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 2px 8px var(--shadow);
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-text);
            border-right: 3px solid var(--accent-main);
            padding-right: 8px;
        }

        .add-habit-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .add-habit-form input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 13px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        .add-habit-form input:focus {
            outline: none;
            border-color: var(--accent-main);
        }

        .btn {
            background: var(--accent-main);
            border: none;
            padding: 9px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-weight: 600;
            touch-action: manipulation;
        }

        .btn:hover, .btn:active {
            background: var(--accent-hover);
        }

        .habits-list {
            max-height: 400px;
            overflow-y: auto;
            padding-left: 2px;
        }

        .habit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-item);
            margin-bottom: 5px;
            padding: 7px 8px;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid var(--border-light);
            gap: 4px;
            transition: background 0.3s, border-color 0.3s;
        }

        .habit-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }

        .habit-info span:last-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .habit-info span:first-child {
            cursor: grab;
            font-size: 14px;
            color: var(--accent-main);
            flex-shrink: 0;
        }

        .habit-actions {
            display: flex;
            gap: 2px;
            align-items: center;
            flex-shrink: 0;
        }

        .habit-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 3px 4px;
            border-radius: 6px;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .move-up, .move-down {
            color: #27ae60;
            font-size: 11px !important;
        }

        .move-up:hover, .move-down:hover {
            background: rgba(39,174,96,0.15);
        }

        .edit-btn {
            color: #e67e22;
        }

        .edit-btn:hover {
            background: rgba(230,126,34,0.15);
        }

        .delete-btn {
            color: #e74c3c;
        }

        .delete-btn:hover {
            background: rgba(231,76,60,0.15);
        }

        .main-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-header {
            background: var(--bg-panel);
            border-radius: 18px;
            padding: 12px 14px;
            box-shadow: 0 2px 8px var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: background 0.3s, border-color 0.3s;
        }

        .date-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-date-controls);
            padding: 5px 10px;
            border-radius: 25px;
            flex-wrap: wrap;
            transition: background 0.3s;
        }

        .date-controls label {
            font-size: 12px;
            font-weight: 600;
        }

        .dropdown-selector {
            position: relative;
        }

        .dropdown-btn {
            background: var(--accent-main);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .dropdown-btn:hover, .dropdown-btn:active {
            background: var(--accent-hover);
        }

        .dropdown-btn::after {
            content: "▼";
            font-size: 9px;
            margin-right: 2px;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 100;
            min-width: 130px;
            max-height: 280px;
            overflow-y: auto;
            padding: 6px;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-menu button {
            display: block;
            width: 100%;
            text-align: right;
            background: none;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-main);
            transition: 0.15s;
            touch-action: manipulation;
        }

        .dropdown-menu button:hover {
            background: rgba(52,152,219,0.15);
        }

        .dropdown-menu button.selected {
            background: var(--accent-main);
            color: white;
            font-weight: bold;
        }

        .history-btn {
            background: var(--accent-main);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .history-btn:hover, .history-btn:active {
            background: var(--accent-hover);
        }

        /* أزرار التحكم */
        .theme-toggle, .color-toggle {
            background: var(--bg-item);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
        }

        .theme-toggle:hover, .color-toggle:hover {
            background: var(--accent-main);
            color: white;
            border-color: var(--accent-main);
        }

        /* لوحة ألوان الطيف */
        .color-picker {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 100;
            padding: 10px;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            min-width: 200px;
        }

        .color-picker.active {
            display: grid;
        }

        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.selected {
            border-color: var(--text-main);
            box-shadow: 0 0 0 2px var(--bg-item);
        }

        .color-selector {
            position: relative;
        }

        .counters {
            display: flex;
            gap: 18px;
        }

        .counter-card {
            text-align: center;
        }

        .counter-card span:first-child {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-text);
        }

        .counter-card p {
            font-size: 10px;
            opacity: 0.8;
            color: var(--text-sub);
        }

        .progress-global {
            width: 180px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background: var(--progress-bg);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-main);
            border-radius: 10px;
            transition: width 0.25s;
        }

        .tracker-table-wrapper {
            background: var(--bg-panel);
            border-radius: 18px;
            padding: 4px 0 8px 0;
            overflow-x: auto;
            box-shadow: 0 2px 8px var(--shadow);
            border: 1px solid var(--border-color);
            -webkit-overflow-scrolling: touch;
            transition: background 0.3s, border-color 0.3s;
        }

        .weeks-container {
            margin-bottom: 2px;
        }

        .weeks-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .weeks-table td {
            background: transparent !important;
            border: none !important;
            padding: 4px 2px;
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            color: var(--accent-text);
            height: 26px;
            white-space: nowrap;
            overflow: hidden;
        }

        .days-header {
            display: grid;
            grid-template-columns: 180px repeat(31, 38px);
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 11px;
            transition: background 0.3s;
        }

        .day-number {
            text-align: center;
            padding: 6px 0;
            color: var(--accent-text);
            border-left: 1px solid var(--border-light);
        }

        .habit-row {
            display: grid;
            grid-template-columns: 180px repeat(31, 38px);
            border-bottom: 1px solid var(--progress-bg);
            align-items: center;
        }

        .habit-title {
            padding: 8px 8px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            position: sticky;
            right: 0;
            background: var(--bg-panel);
            z-index: 2;
            border-left: 1px solid var(--border-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.3s;
        }

        .day-cell {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border-cell);
            background: var(--bg-item);
            transition: background 0.3s;
        }

        .day-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-main);
            touch-action: manipulation;
        }

        .week-bg-0 { background-color: var(--bg-item); }
        .week-bg-1 { background-color: var(--bg-item); opacity: 0.95; }
        .week-bg-2 { background-color: var(--bg-item); opacity: 0.9; }
        .week-bg-3 { background-color: var(--bg-item); opacity: 0.85; }
        .week-bg-4 { background-color: var(--bg-item); opacity: 0.8; }

        .right-panel {
            background: var(--bg-panel);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 2px 8px var(--shadow);
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .analysis-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .habit-analysis-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .habit-name-anal {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .habit-name-anal span:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .anal-progress-bar {
            background: var(--progress-bg);
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
        }

        .anal-fill {
            background: var(--accent-main);
            width: 0%;
            height: 100%;
            transition: width 0.25s;
        }

        .anal-stats {
            font-size: 10px;
            color: var(--text-muted);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--bg-panel);
            border-radius: 20px;
            padding: 18px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .modal-header h3 {
            font-size: 16px;
            color: var(--accent-text);
        }

        .close-modal {
            cursor: pointer;
            font-size: 26px;
            line-height: 1;
            color: var(--accent-main);
            background: none;
            border: none;
            padding: 0 5px;
            touch-action: manipulation;
        }

        .history-item {
            background: var(--bg-item);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-light);
            font-size: 13px;
            border-right: 4px solid var(--accent-main);
        }

        .history-item strong {
            color: var(--accent-text);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- الجانب الأيسر: إدارة العادات -->
    <div class="left-panel">
        <div class="section-title">📋 إدارة العادات</div>
        <div class="add-habit-form">
            <input type="text" id="newHabitName" placeholder="اسم العادة الجديدة">
            <button class="btn" id="addHabitBtn">+ إضافة عادة</button>
        </div>
        <div class="section-title" style="margin-top: 10px;">
            قائمة العادات
            <span style="font-size: 10px; color: var(--accent-main); font-weight: normal;">(اسحب أو استخدم الأسهم للترتيب)</span>
        </div>
        <div id="habitsList" class="habits-list"></div>
    </div>

    <!-- المنطقة الرئيسية -->
    <div class="main-area">
        <div class="stats-header">
            <div class="date-controls">
                <div class="dropdown-selector" id="monthSelector">
                    <button class="dropdown-btn" id="monthBtn">يناير</button>
                    <div class="dropdown-menu" id="monthDropdown"></div>
                </div>
                <div class="dropdown-selector" id="yearSelector">
                    <button class="dropdown-btn" id="yearBtn">2026</button>
                    <div class="dropdown-menu" id="yearDropdown"></div>
                </div>
                <button id="historyBtn" class="history-btn">📜 السجل</button>
                
                <!-- زر تبديل الوضع الفاتح/الداكن -->
                <button id="themeToggle" class="theme-toggle" title="تبديل الوضع الفاتح/الداكن">🌙</button>
                
                <!-- زر تغيير اللون الأساسي -->
                <div class="color-selector" id="colorSelector">
                    <button id="colorToggle" class="color-toggle" title="تغيير اللون الأساسي">🎨</button>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-swatch" data-color="#e74c3c" style="background:#e74c3c;" title="أحمر"></div>
                        <div class="color-swatch" data-color="#e67e22" style="background:#e67e22;" title="برتقالي"></div>
                        <div class="color-swatch" data-color="#f1c40f" style="background:#f1c40f;" title="أصفر"></div>
                        <div class="color-swatch" data-color="#27ae60" style="background:#27ae60;" title="أخضر"></div>
                        <div class="color-swatch" data-color="#3498db" style="background:#3498db;" title="أزرق"></div>
                        <div class="color-swatch" data-color="#4a3f8f" style="background:#4a3f8f;" title="نيلي"></div>
                        <div class="color-swatch" data-color="#8e44ad" style="background:#8e44ad;" title="بنفسجي"></div>
                        <div class="color-swatch" data-color="#7fc4d9" style="background:#7fc4d9;" title="سماوي"></div>
                    </div>
                </div>
            </div>
            <div class="counters">
                <div class="counter-card">
                    <span id="totalHabitsCount">0</span>
                    <p>عدد العادات</p>
                </div>
                <div class="counter-card">
                    <span id="completedTasksCount">0</span>
                    <p>إنجازات الشهر</p>
                </div>
            </div>
            <div class="progress-global">
                <div class="progress-label">
                    <span>نسبة الإنجاز</span>
                    <span id="globalPercentLabel">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="globalProgressFill"></div>
                </div>
            </div>
        </div>

        <div class="tracker-table-wrapper">
            <div class="weeks-container" id="weeksContainer"></div>
            <div class="days-header" id="daysHeader"></div>
            <div id="habitsRowsContainer"></div>
        </div>
    </div>

    <!-- الجانب الأيمن: تحليل العادات -->
    <div class="right-panel">
        <div class="section-title">📊 تحليل العادات</div>
        <div id="analysisContainer" class="analysis-list"></div>
    </div>
</div>

<!-- مودال السجل -->
<div id="historyModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📅 سجل الشهور السابقة</h3>
            <button class="close-modal" onclick="closeHistory()">&times;</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<script>
    // ==================== المتغيرات الأساسية ====================
    let habits = [];
    let completed = {};
    let currentMonth = 1;
    let currentYear = 2026;
    let daysInMonth = 31;
    let nextId = 1;
    let monthHistory = {};
    let draggedItem = null;
    let currentAccent = "#7fc4d9"; // سماوي افتراضي

    const MONTH_NAMES = [
        "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
        "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
    ];

    const YEARS = [];
    for (let y = 2020; y <= 2030; y++) {
        YEARS.push(y);
    }

    // ==================== دوال مساعدة ====================
    function getDaysInMonth(month, year) {
        return new Date(year, month, 0).getDate();
    }

    function getMonthKey(month, year) {
        return `${year}-${month}`;
    }

    function getMonthName(month) {
        return MONTH_NAMES[month - 1] || "";
    }

    // حساب درجة غامقة من اللون (للهوفر)
    function darkenColor(hex, percent) {
        const num = parseInt(hex.replace("#",""), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.max(0, (num >> 16) - amt);
        const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
        const B = Math.max(0, (num & 0x0000FF) - amt);
        return "#" + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
    }

    // ==================== تطبيق اللون الأساسي ====================
    function applyAccentColor(color) {
        currentAccent = color;
        document.documentElement.style.setProperty('--accent-main', color);
        document.documentElement.style.setProperty('--accent-hover', darkenColor(color, 15));
        document.documentElement.style.setProperty('--accent-text', darkenColor(color, 25));
        localStorage.setItem("HabitTrackerAccent", color);
        
        // تحديد اللون المختار في اللوحة
        document.querySelectorAll(".color-swatch").forEach(sw => {
            sw.classList.toggle("selected", sw.dataset.color === color);
        });
    }

    function loadAccentColor() {
        const saved = localStorage.getItem("HabitTrackerAccent");
        if (saved) {
            applyAccentColor(saved);
        } else {
            applyAccentColor("#7fc4d9");
        }
    }

    // ==================== الوضع الفاتح/الداكن ====================
    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        document.getElementById("themeToggle").innerText = isDark ? "☀️" : "🌙";
        localStorage.setItem("HabitTrackerTheme", isDark ? "dark" : "light");
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem("HabitTrackerTheme");
        if (savedTheme === "dark") {
            document.body.classList.add("dark-mode");
            document.getElementById("themeToggle").innerText = "☀️";
        } else {
            document.getElementById("themeToggle").innerText = "🌙";
        }
    }

    // ==================== لوحة الألوان ====================
    function toggleColorPicker() {
        const picker = document.getElementById("colorPicker");
        picker.classList.toggle("active");
    }

    function closeColorPicker() {
        document.getElementById("colorPicker").classList.remove("active");
    }

    // ==================== الحفظ والتحميل ====================
    function saveAllData() {
        const dataToSave = {
            habits: habits,
            completed: completed,
            nextId: nextId,
            currentMonth: currentMonth,
            currentYear: currentYear,
            monthHistory: monthHistory
        };
        localStorage.setItem("HabitTrackerData", JSON.stringify(dataToSave));
    }

    function loadAllData() {
        const stored = localStorage.getItem("HabitTrackerData");
        
        if (stored) {
            try {
                const data = JSON.parse(stored);
                habits = data.habits || [];
                completed = data.completed || {};
                nextId = data.nextId || 1;
                currentMonth = data.currentMonth || 1;
                currentYear = data.currentYear || 2026;
                monthHistory = data.monthHistory || {};
            } catch(e) {
                resetDefaultData();
            }
        } else {
            resetDefaultData();
        }
        
        daysInMonth = getDaysInMonth(currentMonth, currentYear);
        for (let h of habits) {
            if (!completed[h.id]) completed[h.id] = {};
            for (let d = 0; d < daysInMonth; d++) {
                if (completed[h.id][d] === undefined) completed[h.id][d] = false;
            }
        }
        
        updateMonthButton();
        updateYearButton();
    }

    function resetDefaultData() {
        habits = [
            { id: 1, name: "الاستيقاظ المبكر" },
            { id: 2, name: "صلاة الفجر" },
            { id: 3, name: "القراءة اليومية" },
            { id: 4, name: "الرياضة" },
            { id: 5, name: "شرب الماء الكافي" },
            { id: 6, name: "إنجاز المهام الأساسية" },
            { id: 7, name: "تعلم شيء جديد" },
            { id: 8, name: "النوم المبكر" }
        ];
        nextId = 9;
        completed = {};
        monthHistory = {};
        daysInMonth = getDaysInMonth(currentMonth, currentYear);
        for (let h of habits) {
            completed[h.id] = {};
            for (let d = 0; d < daysInMonth; d++) completed[h.id][d] = false;
        }
    }

    // ==================== السجل الشهري ====================
    function saveMonthHistory() {
        const key = getMonthKey(currentMonth, currentYear);
        const totalStats = getGlobalStats();
        
        monthHistory[key] = {
            month: currentMonth,
            year: currentYear,
            monthName: getMonthName(currentMonth),
            totalHabits: habits.length,
            totalCompleted: totalStats.totalChecked,
            totalPossible: totalStats.totalPossible,
            percent: totalStats.percent,
            date: new Date().toISOString()
        };
        
        saveAllData();
    }

    function resetForNewMonth(newMonth, newYear) {
        const newDays = getDaysInMonth(newMonth, newYear);
        const newCompleted = {};
        for (let h of habits) {
            newCompleted[h.id] = {};
            for (let d = 0; d < newDays; d++) {
                newCompleted[h.id][d] = false;
            }
        }
        completed = newCompleted;
        daysInMonth = newDays;
        currentMonth = newMonth;
        currentYear = newYear;
        saveAllData();
        refreshAllUI();
    }

    function checkMonthChange(newMonth, newYear) {
        if (newMonth !== currentMonth || newYear !== currentYear) {
            saveMonthHistory();
            resetForNewMonth(newMonth, newYear);
        }
    }

    // ==================== قائمة الشهور ====================
    function buildMonthDropdown() {
        const dropdown = document.getElementById("monthDropdown");
        dropdown.innerHTML = "";
        MONTH_NAMES.forEach((name, index) => {
            const monthNum = index + 1;
            const btn = document.createElement("button");
            btn.textContent = name;
            if (monthNum === currentMonth) btn.classList.add("selected");
            btn.addEventListener("click", () => selectMonth(monthNum));
            dropdown.appendChild(btn);
        });
    }

    function selectMonth(monthNum) {
        checkMonthChange(monthNum, currentYear);
        updateMonthButton();
        closeAllDropdowns();
    }

    function updateMonthButton() {
        document.getElementById("monthBtn").innerText = getMonthName(currentMonth);
        buildMonthDropdown();
    }

    // ==================== قائمة السنوات ====================
    function buildYearDropdown() {
        const dropdown = document.getElementById("yearDropdown");
        dropdown.innerHTML = "";
        YEARS.forEach(year => {
            const btn = document.createElement("button");
            btn.textContent = year;
            if (year === currentYear) btn.classList.add("selected");
            btn.addEventListener("click", () => selectYear(year));
            dropdown.appendChild(btn);
        });
    }

    function selectYear(year) {
        checkMonthChange(currentMonth, year);
        updateYearButton();
        closeAllDropdowns();
    }

    function updateYearButton() {
        document.getElementById("yearBtn").innerText = currentYear;
        buildYearDropdown();
    }

    // ==================== فتح/إغلاق القوائم ====================
    function toggleDropdown(selectorId) {
        const selector = document.getElementById(selectorId);
        const menu = selector.querySelector(".dropdown-menu");
        const isActive = menu.classList.contains("active");
        closeAllDropdowns();
        closeColorPicker();
        if (!isActive) {
            menu.classList.add("active");
        }
    }

    function closeAllDropdowns() {
        document.querySelectorAll(".dropdown-menu").forEach(menu => {
            menu.classList.remove("active");
        });
    }

    document.addEventListener("click", (e) => {
        if (!e.target.closest(".dropdown-selector")) {
            closeAllDropdowns();
        }
        if (!e.target.closest(".color-selector")) {
            closeColorPicker();
        }
    });

    // ==================== الإحصائيات ====================
    function getGlobalStats() {
        let totalChecked = 0;
        let totalPossible = habits.length * daysInMonth;
        for (let h of habits) {
            for (let d = 0; d < daysInMonth; d++) {
                if (completed[h.id] && completed[h.id][d]) totalChecked++;
            }
        }
        let percent = totalPossible === 0 ? 0 : (totalChecked / totalPossible) * 100;
        return { totalChecked, totalPossible, percent };
    }

    function getHabitDoneCount(habitId) {
        let count = 0;
        for (let d = 0; d < daysInMonth; d++) {
            if (completed[habitId] && completed[habitId][d]) count++;
        }
        return count;
    }

    // ==================== ترتيب العادات ====================
    function moveHabitUp(index) {
        if (index === 0) return;
        [habits[index - 1], habits[index]] = [habits[index], habits[index - 1]];
        saveAllData();
        refreshAllUI();
    }

    function moveHabitDown(index) {
        if (index === habits.length - 1) return;
        [habits[index + 1], habits[index]] = [habits[index], habits[index + 1]];
        saveAllData();
        refreshAllUI();
    }

    // ==================== الرسم ====================
    function renderWeeksRow() {
        const container = document.getElementById("weeksContainer");
        const weekRanges = [
            { name: "الأسبوع الأول", start: 1, end: 7 },
            { name: "الأسبوع الثاني", start: 8, end: 14 },
            { name: "الأسبوع الثالث", start: 15, end: 21 },
            { name: "الأسبوع الرابع", start: 22, end: 28 },
            { name: "الأيام المتبقية", start: 29, end: daysInMonth }
        ];
        
        const validRanges = weekRanges.filter(range => range.start <= daysInMonth);
        
        let tableHtml = '<table class="weeks-table" style="width: 100%; table-layout: fixed;"><tr><td style="width: 180px; background: transparent; border: none;">&nbsp;</td>';
        
        for (let range of validRanges) {
            let spanCount = Math.min(range.end, daysInMonth) - range.start + 1;
            tableHtml += `<td colspan="${spanCount}" style="background: transparent !important; border: none !important;">${range.name}</td>`;
        }
        
        tableHtml += '</tr></table>';
        container.innerHTML = tableHtml;
    }

    function renderDaysHeader() {
        const headerDiv = document.getElementById("daysHeader");
        let html = `<div class="habit-title">العادة</div>`;
        for (let day = 1; day <= daysInMonth; day++) {
            let weekClass = "";
            if (day <= 7) weekClass = "week-bg-0";
            else if (day <= 14) weekClass = "week-bg-1";
            else if (day <= 21) weekClass = "week-bg-2";
            else if (day <= 28) weekClass = "week-bg-3";
            else weekClass = "week-bg-4";
            html += `<div class="day-number ${weekClass}">${day}</div>`;
        }
        headerDiv.innerHTML = html;
    }

    function renderTracker() {
        renderWeeksRow();
        renderDaysHeader();
        
        const container = document.getElementById("habitsRowsContainer");
        container.innerHTML = "";
        for (let h of habits) {
            const rowDiv = document.createElement("div");
            rowDiv.className = "habit-row";
            const titleDiv = document.createElement("div");
            titleDiv.className = "habit-title";
            titleDiv.innerHTML = `<span>✅</span> ${h.name}`;
            rowDiv.appendChild(titleDiv);

            for (let day = 0; day < daysInMonth; day++) {
                let dayNum = day+1;
                let weekClass = "";
                if (dayNum <= 7) weekClass = "week-bg-0";
                else if (dayNum <= 14) weekClass = "week-bg-1";
                else if (dayNum <= 21) weekClass = "week-bg-2";
                else if (dayNum <= 28) weekClass = "week-bg-3";
                else weekClass = "week-bg-4";

                const cell = document.createElement("div");
                cell.className = `day-cell ${weekClass}`;
                const chk = document.createElement("input");
                chk.type = "checkbox";
                chk.className = "day-checkbox";
                chk.checked = (completed[h.id] && completed[h.id][day]) || false;
                chk.addEventListener("change", ((habitId, dayIdx) => {
                    return (e) => {
                        completed[habitId][dayIdx] = e.target.checked;
                        saveAllData();
                        refreshAllUI();
                    };
                })(h.id, day));
                cell.appendChild(chk);
                rowDiv.appendChild(cell);
            }
            container.appendChild(rowDiv);
        }
    }

    function renderHabitsManager() {
        const listDiv = document.getElementById("habitsList");
        listDiv.innerHTML = "";
        
        habits.forEach((habit, index) => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "habit-item";
            itemDiv.draggable = true;
            itemDiv.setAttribute('data-index', index);
            
            itemDiv.addEventListener('dragstart', () => { draggedItem = index; });
            itemDiv.addEventListener('dragover', (e) => e.preventDefault());
            itemDiv.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedItem !== null && draggedItem !== index) {
                    [habits[draggedItem], habits[index]] = [habits[index], habits[draggedItem]];
                    saveAllData();
                    refreshAllUI();
                }
                draggedItem = null;
            });
            
            itemDiv.innerHTML = `
                <div class="habit-info">
                    <span>⋮⋮</span>
                    <span>${habit.name}</span>
                </div>
                <div class="habit-actions">
                    <button class="move-up" data-index="${index}" title="لأعلى">⬆️</button>
                    <button class="move-down" data-index="${index}" title="لأسفل">⬇️</button>
                    <button class="edit-btn" data-id="${habit.id}" title="تعديل">✏️</button>
                    <button class="delete-btn" data-id="${habit.id}" title="حذف">🗑️</button>
                </div>
            `;
            listDiv.appendChild(itemDiv);
        });

        document.querySelectorAll('.move-up').forEach(btn => {
            btn.addEventListener('click', () => moveHabitUp(parseInt(btn.dataset.index)));
        });

        document.querySelectorAll('.move-down').forEach(btn => {
            btn.addEventListener('click', () => moveHabitDown(parseInt(btn.dataset.index)));
        });

        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const habit = habits.find(h => h.id === id);
                if (habit) {
                    const newName = prompt("تعديل اسم العادة:", habit.name);
                    if (newName && newName.trim() !== "") {
                        habit.name = newName.trim();
                        saveAllData();
                        refreshAllUI();
                    }
                }
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                if (confirm("هل أنت متأكد من حذف هذه العادة؟")) {
                    habits = habits.filter(h => h.id !== id);
                    delete completed[id];
                    saveAllData();
                    refreshAllUI();
                }
            });
        });
    }

    function addHabit() {
        const nameInput = document.getElementById("newHabitName");
        const newName = nameInput.value.trim();
        if (newName === "") {
            alert("الرجاء إدخال اسم العادة");
            return;
        }
        const newId = nextId++;
        habits.push({ id: newId, name: newName });
        completed[newId] = {};
        for (let d = 0; d < daysInMonth; d++) completed[newId][d] = false;
        nameInput.value = "";
        saveAllData();
        refreshAllUI();
    }

    function renderAnalysis() {
        const analysisDiv = document.getElementById("analysisContainer");
        analysisDiv.innerHTML = "";
        for (let h of habits) {
            let doneDays = getHabitDoneCount(h.id);
            let percent = (doneDays / daysInMonth) * 100;
            analysisDiv.innerHTML += `
                <div class="habit-analysis-item">
                    <div class="habit-name-anal">
                        <span>✅ ${h.name}</span>
                        <span>${doneDays}/${daysInMonth}</span>
                    </div>
                    <div class="anal-progress-bar">
                        <div class="anal-fill" style="width: ${percent}%;"></div>
                    </div>
                    <div class="anal-stats">${percent.toFixed(1)}% إنجاز</div>
                </div>
            `;
        }
    }

    function updateStats() {
        const stats = getGlobalStats();
        document.getElementById("totalHabitsCount").innerText = habits.length;
        document.getElementById("completedTasksCount").innerText = stats.totalChecked;
        document.getElementById("globalPercentLabel").innerText = `${stats.percent.toFixed(1)}%`;
        document.getElementById("globalProgressFill").style.width = `${stats.percent}%`;
    }

    // ==================== السجل ====================
    function showHistory() {
        const historyDiv = document.getElementById("historyList");
        historyDiv.innerHTML = "";
        const sorted = Object.keys(monthHistory).sort().reverse();
        
        if (sorted.length === 0) {
            historyDiv.innerHTML = "<p style='text-align:center; color: var(--accent-main);'>لا يوجد سجل بعد</p>";
        } else {
            for (let key of sorted) {
                const record = monthHistory[key];
                historyDiv.innerHTML += `
                    <div class="history-item">
                        <strong>${record.monthName || getMonthName(record.month)} ${record.year}</strong><br>
                        الإنجاز: ${record.percent.toFixed(1)}% (${record.totalCompleted} من ${record.totalPossible})<br>
                        <small style="color: var(--text-muted);">تم الحفظ: ${new Date(record.date).toLocaleDateString('ar-EG')}</small>
                    </div>
                `;
            }
        }
        document.getElementById("historyModal").style.display = "flex";
    }

    function closeHistory() {
        document.getElementById("historyModal").style.display = "none";
    }

    // ==================== تحديث الواجهة ====================
    function refreshAllUI() {
        renderTracker();
        renderHabitsManager();
        renderAnalysis();
        updateStats();
    }

    // ==================== التهيئة ====================
    function init() {
        loadTheme();
        loadAccentColor();
        loadAllData();
        refreshAllUI();
        
        document.getElementById("addHabitBtn").addEventListener("click", addHabit);
        document.getElementById("newHabitName").addEventListener("keypress", (e) => {
            if (e.key === "Enter") addHabit();
        });
        document.getElementById("historyBtn").addEventListener("click", showHistory);
        document.getElementById("themeToggle").addEventListener("click", toggleTheme);
        
        document.getElementById("monthBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleDropdown("monthSelector");
        });
        
        document.getElementById("yearBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleDropdown("yearSelector");
        });
        
        // زر تغيير اللون
        document.getElementById("colorToggle").addEventListener("click", (e) => {
            e.stopPropagation();
            closeAllDropdowns();
            toggleColorPicker();
        });
        
        // اختيار لون من اللوحة
        document.querySelectorAll(".color-swatch").forEach(swatch => {
            swatch.addEventListener("click", () => {
                applyAccentColor(swatch.dataset.color);
                closeColorPicker();
            });
        });
        
        document.getElementById("historyModal").addEventListener("click", (e) => {
            if (e.target.id === "historyModal") closeHistory();
        });
    }

    init();
</script>
</body>
</html>
